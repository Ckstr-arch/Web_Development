<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area of a Rectangle</title>
    <script>

        // Prompt the user for width and length
        var width = window.prompt("Please enter the width :");
        var length = window.prompt("Please enter the length :");

        var area = 1/2 * width * length;

        window.alert("The area of the rectangle is: " + area+ " square units");

    </script>
</head>
