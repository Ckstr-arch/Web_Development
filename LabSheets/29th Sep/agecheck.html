<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Check</title>
    <script>
        var age = window.prompt("Please enter your age:");
        var limit = window.prompt("Please enter the age limit for PG:");
        if (age >= limit) {
            window.alert("You are eligible to access this content.");
        } else {
            window.alert("Sorry, you do not meet the age requirement for this movie");
        }
    </script>
</head>

</body>
</html>
