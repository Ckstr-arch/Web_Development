<html>

        <title>LISTS</title>

        <ol>
            <li>Orange</li>
            <li>Apple</li>
            <li>Grapes</li>
        </ol>
        <ol type="i">
            <li> Orange</li>
            <li>Apple</li>
            <li>Grapes</li>
        </ol>
        <ol type="I", start="6">
            <li> Orange</li>
            <li>Apple</li>
            <li>Grapes</li>
        </ol>
        <ul type="circle">
            <li> Car </li>
            <li> Van </li>
            <li> Bus </li>
        </ul>
        <dl>
            <dt>Cofee</dt>
             <dd>This is a hot drink.</dd>
            <dt>Tea</dt>
             <dd>This is a hot drink.</dd>
        </dl>
    </body>
</html>
